<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edit food item details." />
    <meta name="keywords" content="edit, food, admin" />
    <title>Edit Food</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/admin-dashboard.css') }}"
    />
      <!-- favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', filename='icons/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', filename='icons/favicon-16x16.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='icons/site.webmanifest') }}"
    />
  </head>
  <body>
    <header>
      <h1>Admin Dashboard</h1>
      <div class="top-right-button">
        <a href="/login" class="menu-button">Logout</a>
        <a href="/" class="menu-button">Homepage</a>
      </div>
    </header>
    <main>
      <section>
        <h2>Edit Food (ID: {{ food.fid }})</h2>

        <form
          action="/update-food/{{ food.fid }}"
          method="POST"
          class="edit-food-form"
        >
          <label>Food Name:</label>
          <input type="text" name="name" value="{{ food.name }}" required />

          <label>Price:</label>
          <input
            type="number"
            step="0.01"
            name="price"
            value="{{ food.price }}"
            required
          />

          <label>Description:</label>
          <textarea name="description" required>
{{ food.description }}</textarea
          >

          <button type="submit">Save Changes</button>
        </form>
      </section>
    </main>
  </body>
</html>
